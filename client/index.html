<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Basic viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Gematria Journey – Gematria Calculator & Research Workspace</title>
    <meta
      name="description"
      content="Gematria Journey is a modern gematria calculator and research workspace. Create custom gematria systems, keep private encrypted entries, and explore meaningful numerical patterns in your own text."
    />
    <meta
      name="keywords"
      content="Gematria, Gematria Journey, Gematria calculator, numerology, Hebrew gematria, English gematria, ciphers, numerological patterns"
    />
    <meta name="author" content="Gematria Journey" />
    <meta name="application-name" content="Gematria Journey" />
    <meta name="theme-color" content="#050608" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://gematriajourney.com/" />

    <!-- Favicon / logo -->
    <!-- Put logo.png in your Vite public/ folder so it serves at /logo.png -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gematriajourney.com/" />
    <meta property="og:title" content="Gematria Journey – Gematria Calculator & Research Workspace" />
    <meta
      property="og:description"
      content="Build and use custom gematria systems, store encrypted or public entries, and research synchronicities with Gematria Journey."
    />
    <meta property="og:image" content="https://gematriajourney.com/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gematria Journey – Gematria Calculator & Research Workspace" />
    <meta
      name="twitter:description"
      content="A focused workspace for gematria calculations, custom systems, and numerology research."
    />
    <meta name="twitter:image" content="https://gematriajourney.com/logo.png" />

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
